# SPDX-License-Identifier: Apache-2.0
# Optional: requires Pages, a retained gh-pages branch and your own trust settings.
# Pages reports are public unless the site is explicitly private (GitHub Enterprise Cloud).
# Reports include source evidence; private repositories should otherwise use scan artifacts.
# Use the release-generated file; set your own URL and refresh the caller blob after scan-file edits.
# Also grant id-token: write in skill-checks.yml so scans retain signed execution receipts.
name: Publish skill reports
on:
  workflow_run:
    workflows: [Skill checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed Skill checks run to publish
        type: string
        required: true
      run-attempt:
        description: Completed attempt number for that run
        type: string
        required: true
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
  pull-requests: write
jobs:
  reports:
    uses: chrisknvidia/SkillEvaluator-ci-demo/.github/workflows/publish-skill-reports.yml@81f858c0832de63f0d8fa28b98d39fef642ac811
    with:
      run-id: ${{ format('{0}', github.event.workflow_run.id || inputs.run-id) }}
      run-attempt: ${{ format('{0}', github.event.workflow_run.run_attempt || inputs.run-attempt) }}
      report-base-url: https://chrisknvidia.github.io/omniverse-labs/
      trusted-evaluator-shas: 81f858c0832de63f0d8fa28b98d39fef642ac811
      trusted-caller-blobs: 805a60ee86123619c53223d69f9cddd15a43d192
      tools-ref: 81f858c0832de63f0d8fa28b98d39fef642ac811
      tools-repository: chrisknvidia/SkillEvaluator-ci-demo
